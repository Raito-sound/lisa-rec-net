<p>13日は琉球忍者2回目のステージでした。</p>
<p>前回よりもみんなしゃべりも動きもうまくなっていました。来年の舞台が楽しみです。</p>
<p>今年最後のライブは20日です。国際通りてんぶす前、13:00、15:00、17:00ぜひ見にいらしてください！</p>
