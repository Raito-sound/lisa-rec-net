      <h1>「おいしいパンとコーヒー」というイベントに行きました</h1>
      <div class="post-meta"><span>来兎（久場 超）</span><time datetime="2023-05-24T23:32:57.000Z">2023年5月24日</time></div>
    </header>
    <div class="post-content">
<p>パレットくもじ6階で「おいしいパンとコーヒー」というイベントが開催されていたのでいってきました。</p>
<figure><img src="../../assets/blog/%E3%80%8C%E3%81%8A%E3%81%84%E3%81%97%E3%81%84%E3%83%91%E3%83%B3%E3%81%A8%E3%82%B3%E3%83%BC%E3%83%92%E3%83%BC%E3%80%8D%E3%81%A8%E3%81%84%E3%81%86%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88%E3%81%AB%E8%A1%8C%E3%81%8D%E3%81%BE%E3%81%97%E3%81%9F/53820c_6c4901cdc84945f8bf10e55310b59b5f~mv2.jpg" alt="「おいしいパンとコーヒー」というイベントに行きました" loading="lazy" decoding="async" width="1024" height="576"></figure>
<p>たくさんのパン屋さんとコーヒー屋さんが出店しています。</p>
<p>私もうさぎのパンを買いました。</p>
<figure><img src="../../assets/blog/%E3%80%8C%E3%81%8A%E3%81%84%E3%81%97%E3%81%84%E3%83%91%E3%83%B3%E3%81%A8%E3%82%B3%E3%83%BC%E3%83%92%E3%83%BC%E3%80%8D%E3%81%A8%E3%81%84%E3%81%86%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88%E3%81%AB%E8%A1%8C%E3%81%8D%E3%81%BE%E3%81%97%E3%81%9F/53820c_86d81e03345047af9f1616a201878363~mv2.jpg" alt="「おいしいパンとコーヒー」というイベントに行きました" loading="lazy" decoding="async" width="1024" height="576"></figure>
<p>29日までの開催です。</p>
