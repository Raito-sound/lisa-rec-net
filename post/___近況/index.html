      <h1>近況</h1>
      <div class="post-meta"><span>来兎（久場 超）</span><time datetime="2015-02-20T07:56:11.000Z">2015年2月20日</time></div>
    </header>
    <div class="post-content">
<p>新事務所に引っ越してから半年が過ぎ、ようやく荷物も片付いてきました。
前の事務所と比べると広さが約3倍になったので、今まで立てかけておくだけだったキーボードも並べる事ができます。
ギターもいつでも練習できるように並べ、今までよりも楽器に触れる機会を増やそうと思います。</p>
